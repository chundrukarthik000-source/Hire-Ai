services:
  - type: web
    name: aura-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK_MODE
        value: false
      - key: FIREBASE_STORAGE_BUCKET
        value: hiring-agent-p7-2026.firebasestorage.app
      - key: FIREBASE_DATABASE_URL
        value: https://hiring-agent-p7-2026.firebaseio.com
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false  # Set manually in Render dashboard (paste the service account JSON)
